const sv=document.getElementById('screen'), sx=sv.getContext('2d');
let view={s:1,ox:0,oy:0,dpr:1};
function resizeScreen(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  sv.width=Math.max(1,Math.round(innerWidth*dpr)); sv.height=Math.max(1,Math.round(innerHeight*dpr));
  let s=Math.min(sv.width/W,sv.height/H); if(s>=2) s=Math.floor(s*4)/4;      // 확대 배율은 0.25 단위로 맞춰 도트를 또렷하게
  view={s,dpr,ox:Math.round((sv.width-W*s)/2),oy:Math.round((sv.height-H*s)/2)};
}
function blit(){
  const dw=Math.round(W*view.s), dh=Math.round(H*view.s), ox=view.ox, oy=view.oy;
  sx.imageSmoothingEnabled=false;
  sx.fillStyle='#14213d'; sx.fillRect(0,0,sv.width,sv.height);
  if(ox>0){ sx.drawImage(cv,0,0,1,H,0,oy,ox+1,dh); sx.drawImage(cv,W-1,0,1,H,ox+dw-1,oy,sv.width-(ox+dw)+1,dh); }
  if(oy>0){ sx.drawImage(cv,0,50,W,1,ox,0,dw,oy+1); sx.drawImage(cv,0,H-1,W,1,ox,oy+dh-1,dw,sv.height-(oy+dh)+1); }
  sx.drawImage(cv,0,0,W,H,ox,oy,dw,dh);
}
addEventListener('resize',resizeScreen); resizeScreen();

function spr(rows, pal, x, y, cell=G, flip=false, alpha=1){
  if(cell===G){ x=Math.round(x/G)*G; y=Math.round(y/G)*G; }
  ctx.globalAlpha=alpha;
  for(let j=0;j<rows.length;j++){
    const row=rows[j], n=row.length;
    for(let i=0;i<n;i++){
      const ch=row[flip?n-1-i:i]; if(ch==='.') continue;
      ctx.fillStyle = (pal&&pal[ch]) || R_PAL[ch] || PAL[ch] || '#f0f';
      ctx.fillRect(Math.round(x+i*cell), Math.round(y+j*cell), cell, cell);
    }
  }
  ctx.globalAlpha=1;
}
function R(x,y,w,h,c,a=1){ ctx.globalAlpha=a; ctx.fillStyle=c; ctx.fillRect(Math.round(x/G)*G,Math.round(y/G)*G,w*G,h*G); ctx.globalAlpha=1; }
function txt(s,x,y,size,col='#fff',align='left',font='Galmuri11'){
  ctx.font=`${size}px ${font}, sans-serif`; ctx.textAlign=align;
  ctx.fillStyle='#0b1020'; ctx.fillText(s,x+2,y+2);
  ctx.fillStyle=col; ctx.fillText(s,x,y);
  ctx.textAlign='left';
}
function disc(cx,cy,r,c){ for(let y=-r;y<=r;y++) for(let x=-r;x<=r;x++) if(x*x+y*y<=r*r+r*0.5) R((cx+x)*G,(cy+y)*G,1,1,c); }

// ---- 종별 고유 도트 디자인: 기본 체형(base)에 무늬(줄·반점·지느러미)를 입혀서 만든다
function V(base,o={}){
  const g=base.map(r=>r.split('')), body=c=>c==='1'||c==='2'||c==='3';
  (o.stripe||[]).forEach(c=>g.forEach(r=>{ if(c<r.length&&body(r[c])) r[c]=o.ch||'a'; }));
  (o.spots||[]).forEach(([r,c])=>{ if(g[r]&&g[r][c]&&body(g[r][c])) g[r][c]=o.ch||'a'; });
  if(o.line!==undefined) g[o.line]=g[o.line].map(c=>body(c)?(o.ch||'a'):c);
  const rows=g.map(r=>r.join(''));
  if(o.top) rows.unshift(o.top);
  return rows;
}

function bonus(){
  const b={bar:0,wait:0,hook:0,luck:0,price:0,aq:0,xp:0,drain:0,cap:0,info:0};
  for(const j of lineage()) for(const k in JOBS[j].bonus) b[k]+=JOBS[j].bonus[k];
  for(const s of SKILLS){ const l=save.skills[s.id]||0; if(l) for(const k in s.eff) b[k]+=s.eff[k]*l; }
  b.price+=masteredCount()*0.01;
  for(const it of [HATS[save.wear.hat],OUTFITS[save.wear.outfit],SKINS[save.wear.skin]]) if(it) for(const k in it.b) b[k]+=it.b[k];
  return b;
}

// 이로치 색: 색상환을 돌려 다른 색으로
function hex2hsl(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2; let hh=0,s=0;
  if(mx!==mn){ const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn); hh=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; hh*=60; }
  return [hh,s,l]; }
function hsl2hex(h,s,l){ const a=s*Math.min(l,1-l); const f=n=>{ const k=(n+h/30)%12; const c=l-a*Math.max(-1,Math.min(k-3,9-k,1)); return Math.round(255*c).toString(16).padStart(2,'0'); }; return '#'+f(0)+f(8)+f(4); }
const SHP={};
function shinyPalOf(sp){
  if(SHP[sp.n]) return SHP[sp.n];
  const o={}; for(const k in sp.pal){ if(k==='k'||k==='e'||k==='w'){ o[k]=sp.pal[k]; continue; } const [hh,s,l]=hex2hsl(sp.pal[k]); o[k]=hsl2hex((hh+150)%360,Math.min(1,s*1.1+.1),Math.min(.92,l+.04)); }
  return SHP[sp.n]=o;
}
function drawFish(inst,x,y,cell,flip=false,alpha=1){
  const sp=fishOf(inst);
  spr(sp.s,inst.sh?shinyPalOf(sp):sp.pal,x,y,cell,flip,alpha);
  if(inst.sh){
    const w=sp.s[0].length*cell, h=sp.s.length*cell;
    for(let k=0;k<3;k++){
      if(Math.sin(t*5+k*2.1)<0.1) continue;
      const sx=Math.round(x+((Math.sin(t*2.3+k*2)+1)/2)*w), sy=Math.round(y+((Math.cos(t*1.9+k*3)+1)/2)*h), c=Math.max(2,Math.round(cell/2));
      ctx.fillStyle='#fff8b0'; ctx.fillRect(sx,sy,c,c); ctx.fillRect(sx-c,sy,c,c); ctx.fillRect(sx+c,sy,c,c); ctx.fillRect(sx,sy-c,c,c); ctx.fillRect(sx,sy+c,c,c);
    }
  }
}

function beep(f=440, d=0.1, type='square', v=0.05){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type=type; o.frequency.value=f; g.gain.value=v;

function pickFish(p,z=zone,ex=1){
  const pool=FISH.filter(f=>f.hab.includes(z));
  const ws=pool.map(f=>{
    let w=f.w;
    if(f.price>=30) w*=(1+p*2)*luckMul()*ex;
    return w;
  });
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){ if((r-=ws[i])<0) return pool[i]; }
  return pool[0];
}

function gainXp(n){
  if(save.lv>=MAXLV) return 0;
  save.xp+=n; let up=0;
  while(save.lv<MAXLV&&save.xp>=needXp(save.lv)){
    save.xp-=needXp(save.lv); save.lv++; up++;
    const st=save.stats; st.str++; st.sen++; st.foc++; st.luk++;
    const g=JOBS[save.job].grow; for(const k in g) st[k]+=g[k];
    save.sp++;
  }
  if(save.lv>=MAXLV) save.xp=0;
  if(up){
    lvBanner={lv:save.lv,t:3};
    [660,880,1100,1320].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle'),i*110));
  }
  return up;
}

}

function update(dt){
  t+=dt; wobble+=dt;
  B=bonus();
  if(lvBanner){ lvBanner.t-=dt; if(lvBanner.t<=0) lvBanner=null; }
  if(msgT>0) msgT-=dt;
  if(fade>0) fade=Math.max(0,fade-dt*3);
  save.aq.pend+=fishRate()/60*dt;
  advanceTraps(dt);
  mpTick(dt);
  questTick();
  saveT+=dt; if(saveT>3){ saveT=0; persist(); }

  if(scene!=='sea'){ updatePlayer(dt); if(menu==='aqua'||menu==='visit') updateSwim(dt); return; }

  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt;p.l-=dt*1.2;});
  particles=particles.filter(p=>p.l>0);
  ripples.forEach(r=>{r.r+=40*dt;r.l-=dt*0.9;});
  ripples=ripples.filter(r=>r.l>0);

  if(state==='charging'){
    power+=powDir*dt*1.1;
    if(power>=1){power=1;powDir=-1;} if(power<=0){power=0;powDir=1;}
  }
  else if(state==='casting'){
    castT+=dt/0.8;
    const k=Math.min(castT,1);
    bobber.x=rodTip.x+(target.x-rodTip.x)*k;
    bobber.y=rodTip.y+(WATER-rodTip.y)*k-Math.sin(k*Math.PI)*120;
    if(k>=1){
      state='waiting'; target.p=power; nib=.8+Math.random()*1.2; nibD=0;
      waitT=(2+Math.random()*4)*waitMul();
      ripples.push({x:bobber.x,y:WATER,r:4,l:1});
      beep(200,.12,'sine',0.1);
    }
  }
  else if(state==='waiting'){
    waitT-=dt;
    if(Math.random()<dt*0.8) ripples.push({x:bobber.x,y:WATER,r:3,l:.6});
    // 가짜 입질: 찌가 살짝 까딱이지만 아직 기다려야 해요
    nib-=dt; if(nibD>0) nibD-=dt;
    if(nib<=0&&waitT>1.2){ nibD=.35; nib=1+Math.random()*1.8; ripples.push({x:bobber.x,y:WATER,r:3,l:.5}); beep(560,.05,'sine',.04); }
    if(waitT<=0){ state='bite'; hookWindow=hookTime(); hookMax=hookWindow; beep(1000,.12,'square'); }
  }
  else if(state==='bite'){
    hookWindow-=dt;
    if(hookWindow<=0){ state='idle'; say('놓쳤다…'); beep(180,.25,'sawtooth'); }
  }
  else if(state==='reeling'){
    const d=fish.diff*(SPOTS[zone].dm||1);
    reel.ft-=dt;
    if(reel.ft<=0){ reel.tgt=Math.random(); reel.ft=0.4+Math.random()*(1.2/d); }
    reel.fp+=(reel.tgt-reel.fp)*Math.min(1,dt*(1.2+d*1.4));
    // 막대 조작감: 반대로 누르면 즉시 제동 → 입력에 바로 반응
    const rs=reelResp(), want=holding?-1:1;
    if(Math.sign(reel.bv)===-want) reel.bv*=Math.max(0,1-dt*16*rs);
    reel.bv+=(holding?-4.6:3.4)*rs*dt;
    reel.bv=Math.max(-1.9*rs,Math.min(1.9*rs,reel.bv));
    reel.bp+=reel.bv*dt;
    const size=reel.size;
    if(reel.bp<0){reel.bp=0;reel.bv=0;}
    if(reel.bp>1-size){reel.bp=1-size;reel.bv=-reel.bv*0.3;}
    const hit=reel.fp>=reel.bp&&reel.fp<=reel.bp+size;
    reel.combo=hit?(reel.combo||0)+dt:0;                 // 1.5초 연속으로 맞추면 집중 보너스
    reel.prog+=(hit?0.22*(reel.combo>1.5?1.3:1):-0.14*(0.6+d*0.3)*drainMul())*dt;
    reel.hit=hit;
    if(reel.prog>=1) endReel(true);
    if(reel.prog<=0) endReel(false);
  }
}
function updatePlayer(dt){
  if(menu) return;
  let v=0;
  if(keys.ArrowLeft||keys.KeyA) v-=1;
  if(keys.ArrowRight||keys.KeyD) v+=1;
  if(v) walkTo=null;
  else if(walkTo){
    const dx=walkTo.x-player.x;
    if(Math.abs(dx)<5){ const d=walkTo.door; walkTo=null; if(d) openDoor(d); }
    else v=Math.sign(dx);
  }
  player.x+=v*150*dt;
  if(v){ player.dir=v; player.anim+=dt; } else player.anim=0;
  if(scene==='village'){
    player.x=Math.max(10,Math.min(W-10,player.x));
    if(player.x>=W-12&&v>0) go('harbor',24);

function curve(x0,y0,cx,cy,x1,y1,c){
  const n=220;
  for(let i=0;i<=n;i++){
    const k=i/n, a=(1-k)*(1-k), b=2*(1-k)*k, d=k*k;
    R(a*x0+b*cx+d*x1, a*y0+b*cy+d*y1, 1,1,c);
  }
}

function advanceTraps(sec){
  for(const tr of save.traps){
    const tp=TRAPS[tr.tier];
    if(tr.fish.length>=tp.cap){ tr.acc=0; continue; }
    tr.acc=(tr.acc||0)+sec;
    while(tr.acc>=tp.sec&&tr.fish.length<tp.cap){ tr.acc-=tp.sec; tr.fish.push(rollFish(pickFish(0.5,tr.zone,tp.rare),.5)); }
    if(tr.fish.length>=tp.cap) tr.acc=0;
  }
}
function buyTrap(i){
  const tp=TRAPS[i];
  if(save.gold<tp.price||save.traps.length>=MAX_TRAPS) return;
  save.gold-=tp.price; save.traps.push({tier:i,zone:trapZone,fish:[],acc:0});
  persist(); beep(700,.1,'triangle'); say(`${tp.n} 설치! (${ZONE_NAMES[trapZone]})`);
}
function takeTrap(tr){
  let xp=0, shc=0; const n=tr.fish.length;
  for(const inst of tr.fish){
    const f=fishOf(inst), first=!save.caught[inst.n];
    save.bag.push(inst); save.caught[inst.n]=(save.caught[inst.n]||0)+1;
    if(inst.sh){ save.shinyCaught[inst.n]=1; shc++; }
    save.bestIv[inst.n]=Math.max(save.bestIv[inst.n]||0,ivSum(inst));
    xp+=Math.round((3+f.price*0.05+(first?10:0))*(1+B.xp)*(inst.sh?3:1));
  }
  tr.fish=[]; return [n,xp,shc];

function buyListing(l){
  if(mktBusy||save.gold<l.p) return;
  mktBusy=true;
  FB.db.ref('market/'+l.id+'/b').transaction(c=>c===null?mp.user.uid:undefined).then(r=>{
    if(!r.committed){ say('이미 팔렸어요'); mktBusy=false; loadMarket(); return; }
    save.gold-=l.p; save.bag.push({n:l.f.n,s:l.f.s,v:l.f.v,q:l.f.q,sh:l.f.sh?1:0}); persist();
    return FB.db.ref('mail/'+l.s+'/'+l.id).set({g:l.p,f:l.f.n,bn:mp.nick,t:SERVER()})
      .then(()=>FB.db.ref('market/'+l.id).remove())
      .then(()=>{ say(`${l.f.n} 구매 완료! -${l.p}원`,3); beep(880,.1,'triangle'); mktBusy=false; loadMarket(); });
  }).catch(e=>{ say('구매 실패: '+((e&&e.code)||'오류')); mktBusy=false; loadMarket(); });
}
function cancelListing(l){
  if(mktBusy) return; mktBusy=true;
  FB.db.ref('market/'+l.id).remove().then(()=>{ save.bag.push({n:l.f.n,s:l.f.s,v:l.f.v,q:l.f.q,sh:l.f.sh?1:0}); persist(); say('등록을 취소했어요'); mktBusy=false; loadMarket(); })
    .catch(()=>{ say('이미 팔렸어요'); mktBusy=false; loadMarket(); });
}
function listFish(f){
  if(mktBusy||save.bag.indexOf(f)<0) return;
  if(mp.market.filter(l=>l.s===mp.user.uid).length>=5){ say('등록은 최대 5개예요'); return; }
  const price=Math.max(1,Math.round(sellOne(f)*mktMult));
  mktBusy=true;
  const ref=FB.db.ref('market').push();
  ref.set({s:mp.user.uid,sn:mp.nick,f:{n:f.n,s:f.s,v:f.v,q:f.q,sh:f.sh?1:0},p:price,t:SERVER()}).then(()=>{
    const i=save.bag.indexOf(f); if(i>=0) save.bag.splice(i,1); persist();
    say(`${f.n} 등록! ${price}원`,3); mktBusy=false; loadMarket();
  }).catch(e=>{ say('등록 실패: '+((e&&e.code)||'오류')); mktBusy=false; });
}

      button(`등록 ${Math.max(1,Math.round(sellOne(f)*mktMult))}`,x+332-124,y+8,116,34,()=>listFish(f),true,'#e07a1f');
    });
    txt('올린 물고기는 팔리기 전까지 취소할 수 있어요 (수수료 없음)',60,468,18,'#8ecae6','left','Galmuri9');
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt); draw(); blit(); requestAnimationFrame(loop);
}
syncSwim();
advanceTraps(OFFLINE_SEC);
mpInit();
menu='title'; save.helpSeen=true;
requestAnimationFrame(loop);
addEventListener('beforeunload',persist);
</script>
